name: Keep Options Pricing API Alive

# Koyeb's free instance scales to zero after 1 hour of inactivity (fixed,
# can't be disabled) and cold-starts back up in 1-5 seconds. Pinging every
# 30 minutes keeps it comfortably under that threshold - even if one run is
# delayed or skipped, the next one still lands before it sleeps.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  ping-api:
    runs-on: ubuntu-latest

    steps:
      - name: Ping the API
        env:
          RAW_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: |
          if [ -z "$RAW_API_URL" ]; then
            echo "REACT_APP_API_URL secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Normalize: trim whitespace, strip trailing slash, ensure a scheme.
          API_URL=$(echo "$RAW_API_URL" | xargs)
          API_URL="${API_URL%/}"
          case "$API_URL" in
            http://*|https://*) ;;
            *) API_URL="https://$API_URL" ;;
          esac

          echo "Pinging $API_URL/health ..."

          http_code=$(curl -s -L -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            --user-agent "GitHub-Actions-KeepAlive/1.0" \
            "$API_URL/health")

          echo "Response: $http_code"

          if [ "$http_code" = "200" ]; then
            echo "API is awake."
          elif [ "$http_code" = "000" ]; then
            echo "Timeout reaching the API - it may still be cold-starting."
            exit 1
          else
            echo "Unexpected status $http_code."
            exit 1
          fi
